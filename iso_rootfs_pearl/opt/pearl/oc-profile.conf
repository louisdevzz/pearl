# Overclock — AN TOÀN, mặc định TẮT.
# Chỉ chỉnh POWER LIMIT + CORE CLOCK. KHÔNG đụng memory clock (PRL không cần mem).
# Để ENABLE_OC=false nếu không chắc — máy chạy stock, an toàn nhất.

ENABLE_OC=false

# Power limit tính bằng Watt. Vd: 120  (để trống = không đổi power)
POWER_LIMIT=

# Core clock:
#   - NVIDIA: MHz (khoá clock tối đa), vd 1500
#   - AMD:    chỉ số p-state core (vd 2), KHÔNG phải MHz
# Để trống = không đổi core clock.
CORE_CLOCK=
